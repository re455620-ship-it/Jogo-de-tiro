<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena 6v6</title>
<style>
:root{--bg:#10141c;--fg:#fff}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
canvas{display:block}
.b{color:#4da3ff}.r{color:#ff5c5c}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-weight:700;font-size:20px;text-shadow:0 2px 4px #000}
#hp{position:absolute;bottom:20px;left:24px;font-size:28px;font-weight:700;text-shadow:0 2px 4px #000}
#cross{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000}
#msg{position:absolute;top:60%;width:100%;text-align:center;font-size:22px;text-shadow:0 2px 4px #000}
#feed{position:absolute;top:12px;right:16px;text-align:right;font-size:14px;text-shadow:0 1px 3px #000}
#hs{position:absolute;top:30%;width:100%;text-align:center;opacity:0;color:#e11;font:900 44px Impact,sans-serif;letter-spacing:4px;text-shadow:0 0 8px #000,0 3px 0 #400}
#hs .sk{font-size:72px;line-height:1}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:16px;box-sizing:border-box}
#home{background:radial-gradient(circle at 50% 30%,#1d2a44,#0b0e14);overflow:auto}
#home h1{margin:0;font-size:48px;letter-spacing:4px}
#home .sub{opacity:.7;margin-bottom:6px}
.card{background:#1a2030;border:1px solid #2c3550;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;width:min(360px,100%);text-align:left}
.card label{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.9}
input,select{background:#0e121b;color:#fff;border:1px solid #3a4568;border-radius:8px;padding:10px;font-size:16px}
button{background:#2f7fe0;color:#fff;border:0;border-radius:8px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}
button.alt{background:#2e8b57}button.gray{background:#444c66}
button:hover{filter:brightness(1.15)}
hr{border:0;border-top:1px solid #2c3550;width:100%;margin:2px 0}
#st{min-height:18px;font-size:13px;color:#ffb347}
.help{font-size:12px;opacity:.65;max-width:420px}
#ov{background:rgba(0,0,0,.75);display:none;cursor:pointer}
#ov h2{margin:0;font-size:32px}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#000;color:#fff;align-items:center;justify-content:center;flex-direction:column;font-size:22px;gap:12px;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<div id="hud"><div id="score"></div><div id="feed"></div><div id="cross"></div><div id="hp"></div><div id="msg"></div><div id="hs"><div class="sk">💀</div>HEADSHOT</div></div>

<div id="home" class="scr">
 <h1>ARENA 6v6</h1><div class="sub">Tiro em primeira pessoa · 3D</div>
 <div class="card">
  <label>Seu nome<input id="nm" value="Jogador" maxlength="14"></label>
  <button id="off" class="alt">▶ Jogar offline (contra bots)</button>
  <hr>
  <label>Servidor (wss://...)<input id="ip" value="wss://rdsk-2.onrender.com/" autocomplete="off"></label>
  <label>Time<select id="tm"><option value="a">Automático</option><option value="b">Azul</option><option value="r">Vermelho</option></select></label>
  <button id="on">🌐 Entrar no multiplayer</button>
  <div id="st"></div>
